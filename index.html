<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación Deportiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --ink:#132a2e;
    --teal:#0f4c5c;
    --teal-dark:#0a3540;
    --sand:#f6f3ec;
    --card:#ffffff;
    --line:#e4ded0;
    --muted:#6b7a78;
    --green:#22c55e;
    --blue:#3b82f6;
    --amber:#f59e0b;
    --gray:#9ca3af;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,sans-serif;
    background:var(--sand);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Sora',sans-serif;margin:0;}
  #app{max-width:900px;margin:0 auto;padding:24px 20px 80px;}
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;background:var(--teal-dark);color:#fff;
  }
  .topbar .brand{font-family:'Sora',sans-serif;font-weight:800;font-size:1.15rem;letter-spacing:.2px;}
  .topbar .brand span{opacity:.65;font-weight:600;font-size:.85rem;display:block;margin-top:2px;}
  .topbar button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:8px 14px;border-radius:100px;font-size:.85rem;cursor:pointer;}
  .topbar button:hover{background:rgba(255,255,255,.12);}
  .nav{display:flex;gap:8px;margin-bottom:24px;}
  .nav button{
    flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);font-weight:600;cursor:pointer;color:var(--muted);font-size:.9rem;
  }
  .nav button.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;margin-bottom:16px;cursor:pointer;}
  .crumb:hover{color:var(--teal);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;transition:.15s;
  }
  .list-item:hover{border-color:var(--teal);transform:translateX(2px);}
  .list-item .name{font-weight:600;}
  .list-item .meta{color:var(--muted);font-size:.82rem;margin-top:2px;}
  .list-item .arrow{color:var(--muted);}
  .pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:.72rem;font-weight:600;background:#eef2f1;color:var(--teal-dark);}
  .btn{
    padding:11px 18px;border-radius:10px;border:none;font-weight:600;cursor:pointer;
    font-size:.9rem;font-family:inherit;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-outline{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--teal);color:var(--teal);}
  .btn-block{width:100%;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  input,select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:6px;margin-top:14px;}
  label:first-child{margin-top:0;}
  .login-wrap{max-width:380px;margin:80px auto;}
  .login-wrap h1{text-align:center;margin-bottom:6px;}
  .login-wrap p{text-align:center;color:var(--muted);margin-bottom:28px;font-size:.9rem;}
  .error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:10px;font-size:.85rem;margin-top:14px;}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .big{font-size:2rem;margin-bottom:8px;}
  .section-title{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px;}
  .section-title h2{font-size:1.05rem;}
  .category-block{margin-bottom:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);}
  .category-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;cursor:pointer;background:var(--card);user-select:none;
  }
  .category-header:hover{background:#fafaf7;}
  .category-header h3{font-size:.92rem;color:var(--teal-dark);margin:0;}
  .category-header .count{font-size:.72rem;color:var(--muted);font-weight:500;margin-left:8px;}
  .category-header .chev{color:var(--muted);transition:transform .15s;font-size:.75rem;}
  .category-block.open .chev{transform:rotate(180deg);}
  .category-body{display:none;padding:10px 14px 14px;}
  .category-block.open .category-body{
    display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;
  }
  .criterion{
    padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fbfaf7;
  }
  .criterion-head{display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .criterion-head .cname{font-weight:600;font-size:.78rem;}
  .info-btn{
    width:14px;height:14px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);
    background:none;font-size:.56rem;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .info-box{
    display:none;background:#eef2f1;border-radius:7px;padding:6px 8px;font-size:.7rem;color:var(--muted);
    margin-bottom:6px;
  }
  .info-box.show{display:block;}
  .scale-row{display:flex;gap:4px;align-items:flex-start;}
  .scale-opt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1;min-width:0;}
  .scale-dot{
    width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:#fff;transition:.12s;
  }
  .scale-opt input{display:none;}
  .scale-opt input:checked + .scale-dot{border-width:3px;transform:scale(1.1);}
  .scale-label{font-size:.52rem;color:var(--muted);text-align:center;line-height:1.1;}
  .obs-field{margin-top:6px;}
  .obs-field textarea{min-height:30px;font-size:.72rem;padding:6px 8px;}
  @media (max-width:520px){
    .category-block.open .category-body{grid-template-columns:1fr;}
  }
  .personal-block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;}
  .personal-block h3{font-size:.92rem;color:var(--teal-dark);margin-bottom:14px;}
  .personal-field{margin-bottom:14px;}
  .personal-field:last-child{margin-bottom:0;}
  .personal-field label{margin-top:0;}
  .personal-field textarea{min-height:64px;font-size:.85rem;}
  .report-score{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .report-score:last-child{border-bottom:none;}
  .badge-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:8px;}
  .status-tag{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:100px;}
  .status-final{background:#dcfce7;color:#166534;}
  .status-draft{background:#fef3c7;color:#92400e;}
  .toolbar{display:flex;justify-content:flex-end;gap:10px;margin-bottom:16px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(19,42,46,.55);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{background:#fff;border-radius:16px;padding:24px;max-width:400px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-box h3{margin-bottom:16px;}
  .avatar{
    width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.85rem;
  }
  .avatar-lg{width:64px;height:64px;font-size:1.3rem;}
  .avatar-picker{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .avatar-picker .avatar{width:56px;height:56px;font-size:1.1rem;}
  .semaforo-opt{
    display:flex;align-items:flex-start;gap:12px;padding:12px;border:2px solid var(--line);
    border-radius:10px;margin-bottom:8px;cursor:pointer;background:#fff;
  }
  .semaforo-opt.selected{border-color:var(--teal);background:#f3f7f6;}
  .semaforo-dot{width:16px;height:16px;border-radius:50%;flex-shrink:0;margin-top:2px;}
  .bar-chart{display:flex;flex-direction:column;gap:12px;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-label{width:110px;flex-shrink:0;font-size:.8rem;color:var(--muted);font-weight:600;}
  .bar-track{flex:1;background:#f0ede3;border-radius:6px;height:16px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;transition:width .3s;min-width:3px;}
  .bar-count{width:64px;text-align:right;font-size:.8rem;font-weight:700;color:var(--ink);flex-shrink:0;}
  .bar-count-sub{font-size:.68rem;font-weight:500;color:var(--muted);}
  @media print{
    .topbar,.nav,.crumb,.toolbar,.no-print{display:none !important;}
    body{background:#fff;}
    #app{max-width:100%;padding:0;}
  }
</style>
</head>
<body>
<div class="topbar no-print" id="topbar" style="display:none;">
  <div class="brand">Evaluación Deportiva<span id="userEmail"></span></div>
  <button onclick="App.logout()">Cerrar sesión</button>
</div>
<div id="app"></div>

<script>
const SUPABASE_URL = 'https://hdkhhuygjpsazorvtvnf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_EYmpp8rykCNn74nx8MGi3w_Slk-Z1So';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const App = {
  view: 'login',
  user: null,
  currentTeam: null,
  currentSubject: null,      // { id, full_name, type: 'player'|'coach', team_id }
  currentTemplate: null,
  currentEvaluationId: null,
  scaleSelections: {},       // criterionId -> scaleLevelId

  async init(){
    const { data:{ session } } = await client.auth.getSession();
    if(session){
      this.user = session.user;
      document.getElementById('topbar').style.display='flex';
      document.getElementById('userEmail').textContent = session.user.email;
      this.view = 'teams';
    }
    this.render();
  },

  async logout(){
    await client.auth.signOut();
    this.user = null;
    document.getElementById('topbar').style.display='none';
    this.view = 'login';
    this.render();
  },

  async login(email, password){
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Entrando...';
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Entrar';
    if(error){
      document.getElementById('loginError').textContent = 'Email o contraseña incorrectos.';
      document.getElementById('loginError').style.display='block';
      return;
    }
    this.user = data.user;
    document.getElementById('topbar').style.display='flex';
    document.getElementById('userEmail').textContent = data.user.email;
    this.view = 'teams';
    this.render();
  },

  goTeams(){ this.view='teams'; this.currentTeam=null; this.render(); },
  goClubStats(){ this.view='clubStats'; this.render(); },
  goTeam(team){ this.currentTeam = team; this.view='team'; this.render(); },
  goTeamStats(){ this.view='teamStats'; this.render(); },
  goSubject(subject){ this.currentSubject = subject; this.view='subject'; this.render(); },
  goStats(){ this.view='stats'; this.render(); },

  async render(){
    const app = document.getElementById('app');
    app.innerHTML = '<div class="empty">Cargando...</div>';
    try{
      if(this.view==='login') return this.renderLogin();
      if(this.view==='teams') return this.renderTeams();
      if(this.view==='clubStats') return this.renderClubStats();
      if(this.view==='team') return this.renderTeam();
      if(this.view==='teamStats') return this.renderTeamStats();
      if(this.view==='subject') return this.renderSubject();
      if(this.view==='stats') return this.renderStats();
      if(this.view==='newEvaluation') return this.renderEvaluationForm();
      if(this.view==='report') return this.renderReport();
    }catch(err){
      app.innerHTML = '<div class="card"><p>Ha ocurrido un error: '+err.message+'</p><button class="btn btn-outline" onclick="App.render()">Reintentar</button></div>';
      console.error(err);
    }
  },

  // ---------- LOGIN ----------
  renderLogin(){
    document.getElementById('app').innerHTML = `
      <div class="login-wrap">
        <h1>⚽ Evaluación Deportiva</h1>
        <p>Inicia sesión para continuar</p>
        <div class="card">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="tu@email.com">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
          <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:20px;" onclick="App.login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)">Entrar</button>
          <div class="error" id="loginError" style="display:none;"></div>
        </div>
      </div>`;
    document.getElementById('loginPassword').addEventListener('keydown', e=>{
      if(e.key==='Enter') App.login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    });
  },

  // ---------- TEAMS ----------
  async renderTeams(){
    const { data: teams, error } = await client.from('teams').select('*').order('name');
    if(error) throw error;
    let html = `<div class="section-title"><h2>Equipos</h2>
      <div class="row">
        ${teams && teams.length>1 ? `<button class="btn btn-outline" onclick="App.goClubStats()">📊 Estadísticas del club</button>` : ''}
        <button class="btn btn-outline" onclick="App.promptNewTeam()">+ Nuevo equipo</button>
      </div></div>`;
    if(!teams || teams.length===0){
      html += `<div class="empty"><div class="big">🏟️</div>Todavía no hay equipos.<br>Crea el primero para empezar.</div>`;
    } else {
      teams.forEach(t=>{
        html += `<div class="list-item" onclick='App.goTeam(${JSON.stringify(t)})'>
          <div><div class="name">${t.name}</div><div class="meta">Temporada ${t.season}</div></div>
          <div class="arrow">→</div></div>`;
      });
    }
    document.getElementById('app').innerHTML = html;
  },

  async editTeam(){
    const team = this.currentTeam;
    const name = prompt('Nombre del equipo:', team.name);
    if(!name) return;
    const season = prompt('Temporada (ej. 2026/27):', team.season);
    if(!season) return;
    const { error } = await client.from('teams').update({ name, season }).eq('id', team.id);
    if(error) return alert('Error: '+error.message);
    this.currentTeam = { ...team, name, season };
    this.renderTeam();
  },

  async deleteTeam(){
    const team = this.currentTeam;
    const typed = prompt(
      `Esta acción eliminará el equipo "${team.name}" y TODOS sus jugadores, entrenadores y evaluaciones. No se puede deshacer.\n\nEscribe el nombre exacto del equipo para confirmar:`
    );
    if(typed !== team.name){
      if(typed !== null) alert('El nombre no coincide. No se ha eliminado nada.');
      return;
    }
    const { error: e1 } = await client.from('players').delete().eq('team_id', team.id);
    if(e1) return alert('Error al eliminar jugadores: '+e1.message);
    const { error: e2 } = await client.from('coaches').delete().eq('team_id', team.id);
    if(e2) return alert('Error al eliminar entrenadores: '+e2.message);
    const { error: e3 } = await client.from('teams').delete().eq('id', team.id);
    if(e3) return alert('Error al eliminar el equipo: '+e3.message);
    this.goTeams();
  },

  csvEscape(val){
    if(val===null || val===undefined) return '';
    const s = String(val).replace(/"/g,'""');
    return /[",\n;]/.test(s) ? `"${s}"` : s;
  },

  downloadCSV(filename, rows){
    const csv = rows.map(row=> row.map(c=>this.csvEscape(c)).join(';')).join('\r\n');
    const blob = new Blob(['\uFEFF'+csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  },

  async exportTeamCSV(){
    const team = this.currentTeam;
    const btnLabel = 'Exportando...';
    const [{ data: players }, { data: coaches }] = await Promise.all([
      client.from('players').select('id, full_name, number').eq('team_id', team.id),
      client.from('coaches').select('id, full_name').eq('team_id', team.id)
    ]);
    const playerIds = (players||[]).map(p=>p.id);
    const coachIds = (coaches||[]).map(c=>c.id);
    const nameById = {};
    (players||[]).forEach(p=> nameById[p.id] = p.number!=null ? `#${p.number} ${p.full_name}` : p.full_name);
    (coaches||[]).forEach(c=> nameById[c.id] = c.full_name);

    let evals = [];
    if(playerIds.length){
      const { data } = await client.from('evaluations').select('*').in('player_id', playerIds);
      evals = evals.concat(data||[]);
    }
    if(coachIds.length){
      const { data } = await client.from('evaluations').select('*').in('coach_id', coachIds);
      evals = evals.concat(data||[]);
    }
    if(evals.length===0){
      alert('Este equipo todavía no tiene evaluaciones para exportar.');
      return;
    }
    const evalIds = evals.map(e=>e.id);
    const { data: scores, error } = await client.from('evaluation_scores')
      .select('*, criteria(name, max_score, categories(name)), scale_levels(label)')
      .in('evaluation_id', evalIds);
    if(error) return alert('Error: '+error.message);

    const evalById = {};
    evals.forEach(e=> evalById[e.id] = e);

    const rows = [['Equipo','Persona','Tipo','Fecha','Temporada','Estado','Categoría','Criterio','Valoración','Puntuación','Máximo','Observación']];
    scores.forEach(s=>{
      const ev = evalById[s.evaluation_id];
      if(!ev) return;
      const personId = ev.player_id || ev.coach_id;
      rows.push([
        team.name,
        nameById[personId] || '(desconocido)',
        ev.subject_type==='player' ? 'Jugador' : 'Entrenador',
        ev.evaluation_date,
        ev.season,
        ev.status==='final' ? 'Cerrada' : 'Borrador',
        s.criteria && s.criteria.categories ? s.criteria.categories.name : '',
        s.criteria ? s.criteria.name : '',
        s.scale_levels ? s.scale_levels.label : '',
        s.numeric_score!=null ? s.numeric_score : '',
        s.criteria && s.criteria.max_score!=null ? s.criteria.max_score : '',
        s.observation || ''
      ]);
    });
    this.downloadCSV(`evaluaciones_${team.name.replace(/[^a-z0-9]+/gi,'_')}.csv`, rows);
  },

  async exportClubCSV(){
    const [{ data: teams }, { data: players }, { data: coaches }] = await Promise.all([
      client.from('teams').select('id, name'),
      client.from('players').select('id, full_name, number, team_id'),
      client.from('coaches').select('id, full_name, team_id')
    ]);
    const teamNameById = {};
    (teams||[]).forEach(t=> teamNameById[t.id] = t.name);
    const nameById = {};
    const teamIdByPerson = {};
    (players||[]).forEach(p=>{
      nameById[p.id] = p.number!=null ? `#${p.number} ${p.full_name}` : p.full_name;
      teamIdByPerson[p.id] = p.team_id;
    });
    (coaches||[]).forEach(c=>{
      nameById[c.id] = c.full_name;
      teamIdByPerson[c.id] = c.team_id;
    });

    const playerIds = (players||[]).map(p=>p.id);
    const coachIds = (coaches||[]).map(c=>c.id);
    let evals = [];
    if(playerIds.length){
      const { data } = await client.from('evaluations').select('*').in('player_id', playerIds);
      evals = evals.concat(data||[]);
    }
    if(coachIds.length){
      const { data } = await client.from('evaluations').select('*').in('coach_id', coachIds);
      evals = evals.concat(data||[]);
    }
    if(evals.length===0){
      alert('El club todavía no tiene evaluaciones para exportar.');
      return;
    }
    const evalIds = evals.map(e=>e.id);
    const { data: scores, error } = await client.from('evaluation_scores')
      .select('*, criteria(name, max_score, categories(name)), scale_levels(label)')
      .in('evaluation_id', evalIds);
    if(error) return alert('Error: '+error.message);

    const evalById = {};
    evals.forEach(e=> evalById[e.id] = e);

    const rows = [['Equipo','Persona','Tipo','Fecha','Temporada','Estado','Categoría','Criterio','Valoración','Puntuación','Máximo','Observación']];
    scores.forEach(s=>{
      const ev = evalById[s.evaluation_id];
      if(!ev) return;
      const personId = ev.player_id || ev.coach_id;
      const teamId = teamIdByPerson[personId];
      rows.push([
        teamNameById[teamId] || '(sin equipo)',
        nameById[personId] || '(desconocido)',
        ev.subject_type==='player' ? 'Jugador' : 'Entrenador',
        ev.evaluation_date,
        ev.season,
        ev.status==='final' ? 'Cerrada' : 'Borrador',
        s.criteria && s.criteria.categories ? s.criteria.categories.name : '',
        s.criteria ? s.criteria.name : '',
        s.scale_levels ? s.scale_levels.label : '',
        s.numeric_score!=null ? s.numeric_score : '',
        s.criteria && s.criteria.max_score!=null ? s.criteria.max_score : '',
        s.observation || ''
      ]);
    });
    this.downloadCSV('evaluaciones_club_completo.csv', rows);
  },

  async promptNewTeam(){
    const name = prompt('Nombre del equipo:');
    if(!name) return;
    const season = prompt('Temporada (ej. 2025/26):', '2025/26');
    if(!season) return;

    } else {
      coaches.forEach(c=>{
        const subj = {...c, type:'coach'};
        html += `<div class="list-item">
          <div onclick='App.goSubject(${JSON.stringify(subj)})' style="flex:1;cursor:pointer;">

  async togglePersonActive(table, id, newActive){
    if(!newActive){
      const ok = confirm('¿Dar de baja a este jugador/entrenador? No se borra nada, solo dejará de aparecer en la lista principal. Podrás reactivarlo cuando quieras.');
      if(!ok) return;
    }
    const { error } = await client.from(table).update({ active: newActive }).eq('id', id);
    if(error) return alert('Error: '+error.message);
    this.renderTeam();
  },

  async promptNewPerson(type){
    if(type==='player'){
      this.openPlayerModal(null);
      return;
    }
    const name = prompt('Nombre del entrenador:');
    if(!name) return;
    const { error } = await client.from('coaches').insert({ full_name: name, team_id: this.currentTeam.id });
    if(error) return alert('Error: '+error.message);

  editPlayer(player){
    this.openPlayerModal(player);
  },

  initials(name){
    if(!name) return '?';
    const parts = name.trim().split(/\s+/);
    return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
  },

  openPlayerModal(player){
    const isEdit = !!player;
    const currentPhoto = player && player.photo_url ? player.photo_url : null;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'playerModalOverlay';
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${isEdit ? 'Editar jugador' : 'Añadir jugador'}</h3>
        <div class="avatar-picker">
          <div class="avatar" id="playerModalAvatarPreview">
            ${currentPhoto ? `<img src="${currentPhoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : this.initials(player ? player.full_name : '')}
          </div>
          <div style="flex:1;">
            <label style="margin-top:0;">Foto (opcional)</label>
            <input type="file" accept="image/*" id="playerModalPhotoInput" onchange="App.previewPlayerPhoto(event)">
          </div>
        </div>
        <label>Nombre</label>
        <input type="text" id="playerModalName" value="${player ? player.full_name.replace(/"/g,'&quot;') : ''}" placeholder="Nombre completo">
        <label>Número de dorsal (opcional)</label>
        <input type="number" id="playerModalNumber" value="${player && player.number!=null ? player.number : ''}" placeholder="Ej. 7">
        <div class="row" style="margin-top:20px;">
          <button class="btn btn-outline" style="flex:1;" onclick="App.closePlayerModal()">Cancelar</button>
          <button class="btn btn-primary" id="playerModalSaveBtn" style="flex:1;" onclick="App.savePlayerModal(${isEdit ? `'${player.id}'` : 'null'})">Guardar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
  },

  closePlayerModal(){
    const el = document.getElementById('playerModalOverlay');
    if(el) el.remove();
  },

  previewPlayerPhoto(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = e=>{
      document.getElementById('playerModalAvatarPreview').innerHTML =
        `<img src="${e.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    };
    reader.readAsDataURL(file);
  },

  async savePlayerModal(playerId){
    const name = document.getElementById('playerModalName').value.trim();
    if(!name){ alert('Escribe un nombre.'); return; }
    const numStr = document.getElementById('playerModalNumber').value;
    const number = numStr && numStr.trim() !== '' ? parseInt(numStr, 10) : null;
    const fileInput = document.getElementById('playerModalPhotoInput');
    const file = fileInput.files[0];

    const btn = document.getElementById('playerModalSaveBtn');
    btn.disabled = true; btn.textContent = 'Guardando...';

    let photo_url = undefined; // undefined = don't touch existing value
    if(file){
      const ext = file.name.split('.').pop();
      const path = `${playerId || 'new-' + Date.now()}-${Date.now()}.${ext}`;
      const { error: uploadErr } = await client.storage.from('player-photos').upload(path, file, { upsert:true });
      if(uploadErr){
        btn.disabled = false; btn.textContent = 'Guardar';
        alert('No se pudo subir la foto: '+uploadErr.message+'\n\n¿Has creado el bucket "player-photos" en Supabase Storage?');
        return;
      }
      const { data: pub } = client.storage.from('player-photos').getPublicUrl(path);
      photo_url = pub.publicUrl;
    }

    const payload = { full_name: name, number: isNaN(number) ? null : number };
    if(photo_url !== undefined) payload.photo_url = photo_url;

    let error;
    if(playerId){
      ({ error } = await client.from('players').update(payload).eq('id', playerId));
    } else {
      payload.team_id = this.currentTeam.id;
      ({ error } = await client.from('players').insert(payload));
    }

    btn.disabled = false; btn.textContent = 'Guardar';
    if(error) return alert('Error: '+error.message);
    this.closePlayerModal();
    this.renderTeam();
  },

  async editCoach(coach){
    const name = prompt('Nombre del entrenador:', coach.full_name);
    if(!name) return;
    const { error } = await client.from('coaches').update({ full_name: name }).eq('id', coach.id);
    if(error) return alert('Error: '+error.message);
    this.renderTeam();
  },

  // ---------- CLUB STATS (aggregates all teams / all players) ----------
  async renderClubStats(){
    const { data: teams, error: e0 } = await client.from('teams').select('*').order('name');
    if(e0) throw e0;

    const { data: players, error: e1 } = await client.from('players')
      .select('id, team_id').eq('active', true);
    if(e1) throw e1;

    if(!players || players.length===0){
      document.getElementById('app').innerHTML = `<div class="crumb" onclick="App.goTeams()">← Todos los equipos</div>

        <div class="empty"><div class="big">📊</div>Todavía no hay jugadores registrados en el club.</div>`;
      return;
    }

    const playerIds = players.map(p=>p.id);
    const { data: evals, error: e2 } = await client.from('evaluations')
      .select('id, player_id, season, category_summary:evaluation_scores(scale_level_id, criteria(category_id, categories(name)), scale_levels(label,color,sort_order))')
      .in('player_id', playerIds);
    if(e2) throw e2;

    this._clubStatsTeams = teams || [];
    this._clubStatsPlayers = players;
    this._clubStatsEvals = evals || [];
    this.clubStatsSeasonFilter = 'all';
    this.renderClubStatsBody();
  },

  onClubStatsSeasonChange(value){
    this.clubStatsSeasonFilter = value;
    this.renderClubStatsBody();
  },

  renderClubStatsBody(){
    const teams = this._clubStatsTeams || [];
    const players = this._clubStatsPlayers || [];
    const evals = this._clubStatsEvals || [];
    const seasonFilter = this.clubStatsSeasonFilter || 'all';
    const filteredEvals = seasonFilter==='all' ? evals : evals.filter(ev=>ev.season===seasonFilter);
    const uniqueSeasons = [...new Set(evals.map(ev=>ev.season))];

    let html = `<div class="crumb" onclick="App.goTeams()">← Todos los equipos</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div><h2>Estadísticas del club</h2>
        <p style="color:var(--muted);font-size:.85rem;margin:4px 0 14px;">${teams.length} equipo(s) · ${players.length} jugador(es) en total</p></div>
        <button class="btn btn-outline" onclick="App.exportClubCSV()">⬇️ Exportar CSV</button>
      </div>
      <div style="margin-bottom:18px;max-width:220px;">
        <label style="margin-top:0;">Temporada</label>
        <select onchange="App.onClubStatsSeasonChange(this.value)">
          <option value="all" ${seasonFilter==='all'?'selected':''}>Todas las temporadas</option>
          ${uniqueSeasons.map(s=>`<option value="${s}" ${seasonFilter===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>`;

    const allScores = [];
    filteredEvals.forEach(ev=>{
      (ev.category_summary||[]).forEach(s=> allScores.push(s));
    });

    if(allScores.length===0){
      html += `<div class="empty"><div class="big">📊</div>No hay evaluaciones para esta selección.</div>`;
      document.getElementById('app').innerHTML = html;
      return;
    }

    // ---- Overall club summary ----
    html += `<div class="card"><h3 style="margin-bottom:14px;">Resumen general del club</h3>`;
    html += this.buildBarChart(allScores);
    html += `</div>`;

    // ---- Comparison between teams ----
    const playerToTeam = {};
    players.forEach(p=> playerToTeam[p.id] = p.team_id);
    const evalsByTeam = {};
    filteredEvals.forEach(ev=>{
      const teamId = playerToTeam[ev.player_id];
      if(!teamId) return;
      if(!evalsByTeam[teamId]) evalsByTeam[teamId] = [];
      (ev.category_summary||[]).forEach(s=> evalsByTeam[teamId].push(s));
    });

    const teamsWithData = teams.filter(t=> evalsByTeam[t.id] && evalsByTeam[t.id].length);
    if(teamsWithData.length > 1){
      html += `<div class="section-title"><h2 style="font-size:1rem;">Comparativa por equipo</h2></div>`;
      teamsWithData.forEach(t=>{
        html += `<div class="card"><h3 style="margin-bottom:14px;">${t.name} <span style="font-weight:500;color:var(--muted);font-size:.78rem;">· ${t.season}</span></h3>`;
        html += this.buildBarChart(evalsByTeam[t.id]);
        html += `</div>`;
      });
    }

    // ---- Distribution per category (whole club) ----
    const byCategory = {};
    allScores.forEach(s=>{
      const catName = s.criteria && s.criteria.categories ? s.criteria.categories.name : 'General';
      if(!byCategory[catName]) byCategory[catName] = [];
      byCategory[catName].push(s);
    });
    html += `<div class="section-title"><h2 style="font-size:1rem;">Por categoría (todo el club)</h2></div>`;
    Object.keys(byCategory).forEach(catName=>{
      html += `<div class="card"><h3 style="margin-bottom:14px;">${catName}</h3>`;
      html += this.buildBarChart(byCategory[catName]);
      html += `</div>`;
    });

    document.getElementById('app').innerHTML = html;
  },

      .filter(ev=> dateFilter==='all' || ev.evaluation_date===dateFilter)
      .filter(ev=> seasonFilter==='all' || ev.season===seasonFilter);

    const allScores = [];
    filteredEvals.forEach(ev=>{
      (ev.category_summary||[]).forEach(s=> allScores.push(s));
    });

    // unique dates/seasons for the dropdowns, most recent first
    const uniqueDates = [...new Set(evals.map(ev=>ev.evaluation_date))];
    const uniqueSeasons = [...new Set(evals.map(ev=>ev.season))];

    let html = `<div class="crumb" onclick='App.goSubject(${JSON.stringify(subj)})'>← ${subj.full_name}</div>
      <h2>Estadísticas</h2>
      <p style="color:var(--muted);font-size:.85rem;margin:4px 0 14px;">${subj.full_name} · ${evals.length} evaluación(es) registradas</p>
      <div class="row" style="margin-bottom:18px;">
        <div style="max-width:220px;">
          <label style="margin-top:0;">Temporada</label>
          <select onchange="App.onStatsSeasonChange(this.value)">
            <option value="all" ${seasonFilter==='all'?'selected':''}>Todas las temporadas</option>
            ${uniqueSeasons.map(s=>`<option value="${s}" ${seasonFilter===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div style="max-width:260px;">
          <label style="margin-top:0;">Fecha</label>
          <select onchange="App.onStatsDateChange(this.value)">
            <option value="all" ${dateFilter==='all'?'selected':''}>Todas las evaluaciones (acumulado)</option>
            ${uniqueDates.map(d=>`<option value="${d}" ${dateFilter===d?'selected':''}>Evaluación del ${d}</option>`).join('')}
          </select>
        </div>
      </div>`;

    if(allScores.length===0){
      html += `<div class="empty"><div class="big">📊</div>No hay puntuaciones para esta selección.</div>`;
      document.getElementById('app').innerHTML = html;
      return;
    }

    // ---- Evolution over time (always uses the FULL history, ignores filters above) ----
    const trendHtml = this.buildTrendChart(evals);
    if(trendHtml){
      html += `<div class="card">
        <h3 style="margin-bottom:4px;">Evolución en el tiempo</h3>
        <p style="color:var(--muted);font-size:.76rem;margin:0 0 14px;">Media general por evaluación · siempre muestra todo el histórico, independientemente de los filtros de arriba</p>
        ${trendHtml}
      </div>`;
    }

    // ---- Overall distribution (all categories combined) ----
    html += `<div class="card"><h3 style="margin-bottom:14px;">Resumen general</h3>`;
    html += this.buildBarChart(allScores);
    html += `</div>`;

    // ---- Distribution per category ----
    const byCategory = {};
    allScores.forEach(s=>{
      const catName = s.criteria && s.criteria.categories ? s.criteria.categories.name : 'General';
      if(!byCategory[catName]) byCategory[catName] = [];
      byCategory[catName].push(s);
    });
    Object.keys(byCategory).forEach(catName=>{
      html += `<div class="card"><h3 style="margin-bottom:14px;">${catName}</h3>`;
      html += this.buildBarChart(byCategory[catName]);
      html += `</div>`;
    });

    document.getElementById('app').innerHTML = html;
  },

  // Builds a simple SVG line chart showing the average score per evaluation
  // date, so you can see how a player evolves over time. Uses a fixed 1-4
  // scale matching the app's standard levels (excludes "No observado").
  buildTrendChart(evals){
    const LEVEL_LABELS = { 4:'Excelente', 3:'Consolidado', 2:'En Desarrollo', 1:'Necesita apoyo' };
    const sorted = [...evals].sort((a,b)=> new Date(a.evaluation_date) - new Date(b.evaluation_date));
    const points = [];
    sorted.forEach(ev=>{
      const rated = (ev.category_summary||[]).filter(s=> s.scale_levels && s.scale_levels.label !== 'No observado' && s.scale_levels.sort_order!=null);
      if(rated.length===0) return;
      const avg = rated.reduce((sum,s)=> sum + (5 - s.scale_levels.sort_order), 0) / rated.length;
      points.push({ date: ev.evaluation_date, avg });
    });
    if(points.length < 2) return null; // not meaningful with a single point

    const W = Math.max(360, points.length * 70);
    const H = 170, padL = 90, padR = 16, padT = 14, padB = 30;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const minV = 1, maxV = 4;
    const x = i => padL + (points.length>1 ? (i/(points.length-1))*plotW : plotW/2);
    const y = v => padT + plotH - ((v-minV)/(maxV-minV))*plotH;

    let svg = `<div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:none;">`;
    // horizontal grid lines + level labels
    for(let lvl=1; lvl<=4; lvl++){
      const gy = y(lvl);
      svg += `<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="#e4ded0" stroke-width="1"/>`;
      svg += `<text x="${padL-8}" y="${gy+3}" text-anchor="end" font-size="9" fill="#6b7a78">${LEVEL_LABELS[lvl]}</text>`;
    }
    // line
    const linePoints = points.map((p,i)=> `${x(i)},${y(p.avg)}`).join(' ');
    svg += `<polyline points="${linePoints}" fill="none" stroke="#0f4c5c" stroke-width="2.5"/>`;
    // dots + date labels
    points.forEach((p,i)=>{
      svg += `<circle cx="${x(i)}" cy="${y(p.avg)}" r="4.5" fill="#0f4c5c"/>`;
      svg += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#6b7a78">${p.date}</text>`;
    });
    svg += `</svg></div>`;
    return svg;
  },

  // Builds a simple horizontal bar chart (pure CSS) counting how many
  // scores fall into each scale level, ordered by the scale's sort_order.
  buildBarChart(scores){
    const counts = {}; // label -> {count, color, order}
    scores.forEach(s=>{
      const sl = s.scale_levels;
      const label = sl ? sl.label : 'No observado';
      const color = sl ? sl.color : '#9ca3af';
      const order = sl ? sl.sort_order : 99;
      if(!counts[label]) counts[label] = { count:0, color, order };
      counts[label].count++;
    });
    const rows = Object.keys(counts).map(label=>({ label, ...counts[label] }))
      .sort((a,b)=>a.order-b.order);
    const total = rows.reduce((sum,r)=>sum+r.count, 0) || 1;

    let html = '<div class="bar-chart">';
    rows.forEach(r=>{
      const pct = Math.round((r.count/total)*100);
      html += `<div class="bar-row">
        <div class="bar-label">${r.label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${r.color};"></div></div>
        <div class="bar-count">${pct}% <span class="bar-count-sub">(${r.count})</span></div>
      </div>`;
    });
    html += '</div>';
    return html;
  },

  toggleScaleDot(dotEl, critId, slId, color){
    const input = dotEl.previousElementSibling;
    const row = document.getElementById('scalerow-'+critId);
    const allDots = row.querySelectorAll('.scale-dot');

    if(input.checked){
      // already selected -> unmark
      input.checked = false;
      delete this.scaleSelections[critId];
      allDots.forEach(d=> d.style.background = '');
    } else {
      input.checked = true;
      this.scaleSelections[critId] = slId;
      allDots.forEach(d=> d.style.background = '');
      dotEl.style.background = color;
    }
  },

  async saveEvaluation(status){
    const subj = this.currentSubject;
    const template = this.currentTemplate;
    const coachMode = this._coachMode;
    const isEditing = !!this._editingEvaluationId;

    const payload = {
      template_id: template.id,
      subject_type: subj.type,
      season: isEditing ? this._editingEvaluationRow.season : this.currentTeam.season,
      status: status,
    };
    if(!isEditing){
      payload[subj.type==='player' ? 'player_id' : 'coach_id'] = subj.id;
    }

    if(coachMode){
      payload.semaforo = this.selectedSemaforo || null;
    } else {
      payload.entrenabilidad = document.getElementById('pf-entrenabilidad').value || null;
      payload.fortalezas = document.getElementById('pf-fortalezas').value || null;
      payload.objetivos_mejora = document.getElementById('pf-objetivos_mejora').value || null;
      payload.observaciones_entrenador = document.getElementById('pf-observaciones_entrenador').value || null;
    }

    let evalRow;
    if(isEditing){
      const { data, error } = await client.from('evaluations').update(payload).eq('id', this._editingEvaluationId).select().single();
      if(error) return alert('Error al actualizar la evaluación: '+error.message);
      evalRow = data;
      const { error: delErr } = await client.from('evaluation_scores').delete().eq('evaluation_id', evalRow.id);
      if(delErr) return alert('Error al actualizar las puntuaciones: '+delErr.message);
    } else {
      const { data, error } = await client.from('evaluations').insert(payload).select().single();
      if(error) return alert('Error al guardar la evaluación: '+error.message);
      evalRow = data;
    }

    const scores = [];
    this._formCriteria.forEach(crit=>{
      const obs = document.getElementById(`obs-${crit.id}`).value || null;
      if(coachMode){
        const scoreInput = document.getElementById(`score-${crit.id}`);
        const raw = scoreInput ? scoreInput.value : '';
        const val = raw !== '' ? parseInt(raw, 10) : null;
        const max = crit.max_score != null ? crit.max_score : null;
        const clamped = (val!=null && !isNaN(val)) ? Math.max(0, max!=null ? Math.min(val, max) : val) : null;
        if(clamped!=null || obs){
          scores.push({
            evaluation_id: evalRow.id,
            criterion_id: crit.id,
            numeric_score: clamped,
            observation: obs
          });
        }
      } else {
        const selectedInput = document.querySelector(`input[name="scale-${crit.id}"]:checked`);
        if(selectedInput || obs){
          scores.push({
            evaluation_id: evalRow.id,
            criterion_id: crit.id,
            scale_level_id: selectedInput ? selectedInput.value : null,
            observation: obs
          });
        }
      }
    });
    if(scores.length){
      const { error: e2 } = await client.from('evaluation_scores').insert(scores);
      if(e2) return alert('La evaluación se guardó pero hubo un error guardando las puntuaciones: '+e2.message);
    }
    this._editingEvaluationId = null;
    this._editingEvaluationRow = null;
    this.currentEvaluationId = evalRow.id;
    this.view = 'report';
    this.render();
  },

        const opt = this.SEMAFORO_OPTIONS.find(o=>o.value===ev.semaforo);
        if(opt){
          html += `<div class="card" style="display:flex;align-items:center;gap:12px;">
            <span class="semaforo-dot" style="background:${opt.color};width:20px;height:20px;"></span>
            <div><strong>${opt.label}</strong><div style="color:var(--muted);font-size:.8rem;">${opt.desc}</div></div>
          </div>`;
        }
      }
    }

    Object.keys(byCategory).forEach(catName=>{
      html += `<div class="card"><h3 style="margin-bottom:10px;">${catName}</h3>`;
      byCategory[catName].forEach(s=>{
        if(coachMode){
          const max = s.criteria && s.criteria.max_score!=null ? s.criteria.max_score : null;
          html += `<div class="report-score">
            <div>${s.criteria.name}</div>
            <div style="font-weight:700;font-size:.9rem;">${s.numeric_score!=null ? s.numeric_score : '—'}${max!=null ? ` / ${max}` : ''}</div>
          </div>`;
        } else {
          const label = s.scale_levels ? s.scale_levels.label : 'No observado';
          const color = s.scale_levels ? s.scale_levels.color : '#9ca3af';
          html += `<div class="report-score">
            <div><span class="badge-dot" style="background:${color};"></span>${s.criteria.name}</div>
            <div style="font-weight:600;font-size:.85rem;">${label}</div>
          </div>`;
        }
        if(s.observation){
          html += `<div style="font-size:.8rem;color:var(--muted);margin:-4px 0 8px 22px;">${s.observation}</div>`;
        }
      });
      html += `</div>`;
    });

    const personalFields = [
      { key:'entrenabilidad', label:'Entrenabilidad' },
      { key:'fortalezas', label:'Fortalezas' },
      { key:'objetivos_mejora', label:'Objetivos de mejora' },
      { key:'observaciones_entrenador', label:'Observaciones del entrenador' }
    ].filter(f => ev[f.key]);

    if(personalFields.length){
      html += `<div class="card"><h3 style="margin-bottom:10px;">Desarrollo personal</h3>`;
      personalFields.forEach(f=>{
        html += `<div style="margin-bottom:12px;"><div style="font-weight:600;font-size:.82rem;color:var(--teal-dark);margin-bottom:2px;">${f.label}</div>
          <div style="font-size:.85rem;color:var(--ink);">${ev[f.key]}</div></div>`;
      });
      html += `</div>`;
    }

    if(ev.general_notes){
      html += `<div class="card"><h3>Notas generales</h3><p>${ev.general_notes}</p></div>`;
    }

    document.getElementById('app').innerHTML = html;
  }
};

App.init();
</script>
</body>
</html>
